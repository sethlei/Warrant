\* TLC config for the Warrant compose-algebra cross-check.
\* N=6 is a fast, fully-exhaustive default (15,625 states, ~6s). The pass was
\* verified clean up to N=8 (390,625 states, ~4m22s) — change `N = 6` to `N = 8`
\* to reproduce the maximum bound.
SPECIFICATION Spec

CONSTANTS
    N = 6

\* Each invariant is listed separately so a violation names the offending property.
INVARIANT TypeOK
INVARIANT FourCellMapping
INVARIANT ANDCompose
INVARIANT ORCompose
INVARIANT Duality
INVARIANT FuzzyDeathNeverHard
INVARIANT PartialDeathIsHardInAND
INVARIANT OrderIndependent
INVARIANT ResultsWellTyped
